[project]
name = "content-os"
version = "0.1.0"
description = "Video content pipeline CLI with Remotion subtitle integration"
requires-python = ">=3.12"

dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    "webrtcvad>=2.0.0",
    "whisper>=20231117",
    "imageio-ffmpeg>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.15.0",
]

# ============================================================
# PYTHON TOOLING (Ruff)
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501", "B008", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ============================================================
# TYPE STUBS
# ============================================================
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true
local_prefixes = "scripts"
namespace_packages = true
explicit_package_bases = true
mypy_path = "stubs"

# ============================================================
# JS TOOLING (Prettier - in remotion/ directory)
# ============================================================
# Prettier config is in remotion/package.json
#
# To format JS/TS files:
#   cd remotion && pnpm exec prettier --write "src/**/*.{js,jsx,ts,tsx}"
#
# To check formatting:
#   cd remotion && pnpm format:check
